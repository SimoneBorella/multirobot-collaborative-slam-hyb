submap_manager:
    submap_mapping_rate: 1.0

    submap_resolution: 0.05 
    submap_width: 14.0
    submap_height: 14.0

    free_belief: 0.4
    occ_belief: 0.85
    distance_belief_factor: 0.03
    log_odds_min: -100.0
    log_odds_max: 100.0
    noise_radius: 0.07
    noise_std_dev: 0.03

    obstacle_threshold: 0.70
    free_threshold: 0.30