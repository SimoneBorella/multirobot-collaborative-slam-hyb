mapping_rate: 1.0

map_resolution: 0.05 
map_width: 40.0
map_height: 40.0

log_odds_min: -10.0
log_odds_max: 10.0

obstacle_threshold: 0.70
free_threshold: 0.30

costmap_kernel_distance: 0.3
costmap_decay_rate: 4.0

refinement_variance_threshold: 0.09 # Probability under 0.9
refinement_observations_threshold: 3 # Obseravtions under 8

epsilon: 0.5
min_points: 3
min_frontier_size: 0.03 # Small Indoor
# min_frontier_size: 0.04 # Large Indoor

extract_refinement_frontiers: false

min_refinement_frontier_size: 0.005
